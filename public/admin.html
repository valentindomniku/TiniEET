<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TiniEET – administrace</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">TiniEET <span class="verze" id="verze"></span> <small>administrace</small></div>
    <button type="button" class="btn-small" id="odhlasit" hidden>Odhlásit</button>
    <a href="/" class="btn btn-small">Pokladna</a>
  </header>

  <main>
    <form id="login" class="card login-card" hidden novalidate>
      <h1>Administrace</h1>
      <label for="heslo">Heslo</label>
      <input id="heslo" type="password" autocomplete="current-password">
      <p class="err-text" id="login-err"></p>
      <button type="submit" class="btn-primary btn-big">Přihlásit</button>
    </form>

    <div id="obsah" hidden>
      <div id="eet"></div>

      <section class="section">
        <h2>Neodeslané do EET</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Č.</th><th>Čas</th><th>Služba</th><th class="num">Částka</th><th>Stav</th><th>Pokusů</th><th>Poslední chyba</th><th></th></tr></thead>
            <tbody id="neodeslane"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Přehled dne</h2>
          <input type="date" id="datum" class="date">
        </div>
        <p class="trzba">Tržba: <strong id="trzba"></strong> <span class="muted" id="pocet"></span></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Čas</th><th>Služba</th><th class="num">Částka</th><th>EET</th><th></th></tr></thead>
            <tbody id="den-platby"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <h2>Služby</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Název</th><th class="num">Cena (Kč)</th><th></th></tr></thead>
            <tbody id="sluzby"></tbody>
          </table>
        </div>
        <form id="nova-sluzba" class="inline-form" novalidate>
          <div><label for="ns-nazev">Nová služba</label><input id="ns-nazev" maxlength="100" placeholder="Název"></div>
          <div><label for="ns-cena">Cena (Kč)</label><input id="ns-cena" inputmode="decimal" placeholder="350"></div>
          <button type="submit" class="btn-primary">Přidat</button>
        </form>
      </section>
    </div>
  </main>

  <dialog id="dlg-storno">
    <form id="form-storno" novalidate>
      <div class="dlg-body">
        <h2>Storno platby</h2>
        <p id="ds-popis"></p>
        <label for="ds-duvod">Důvod storna</label>
        <input id="ds-duvod" maxlength="200" autocomplete="off">
        <p class="hint">Původní platba zůstane uložená, storno se zapíše jako nový záporný záznam.</p>
        <p class="err-text" id="ds-err"></p>
      </div>
      <div class="dlg-actions">
        <button type="button" class="btn-big" data-zavrit>Zpět</button>
        <button type="submit" class="btn-danger btn-big">Stornovat</button>
      </div>
    </form>
  </dialog>

  <script src="/js/spolecne.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
